title: Patrick Präg
theme: jekyll-theme-minimal
description: I work as a researcher at [Oxford University’s Department of Sociology](https://www.sociology.ox.ac.uk/academic-staff/patrick-praeg.html) and am a Research Fellow at [Nuffield College](https://www.nuffield.ox.ac.uk/people/profiles/patrick-praeg/). I do research on social stratification, social demography, health and wellbeing, and work and family reconciliation. In my work, I mostly use quantitative methods and survey data. I have a PhD from the [ICS/University of Groningen](http://ics-graduateschool.nl/). | Below is a list of my publications. If you want to find out more about me and my work, this is my [Google Scholar profile](https://scholar.google.com/citations?user=MW-rFm4AAAAJ). This is my [Open Science Framework](https://osf.io/euzd6/) profile. Follow me on [Twitter](https://twitter.com/ppraeg). This is a collection of [Stata commands I have found useful](http://statafun.blogspot.com/) at some point. This is a [collection of chocolate bar reviews](https://www.instagram.com/schokomonstranz/) I wrote (in German). Find my contact details at the bottom of the page.
